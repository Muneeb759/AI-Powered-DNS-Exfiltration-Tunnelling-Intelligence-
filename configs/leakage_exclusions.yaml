allowlist_prefixes:
  - "sl_"
  - "sf_"

explicit_exclusions:
  timestamp: "Temporal shortcut - leaks collection day and execution timing"
  sld: "Raw registrable domain / IP octet / NetBIOS string identity shortcut (violates Control 4)"
  longest_word: "Raw string token shortcut - carries domain identity text"
  capture_file: "Internal file metadata / grouping key - not a feature"
  unit_id: "Decision unit primary key - identifier only"
  session_id: "Session grouping identifier - identifier only"
  collection_day: "Collection day partition key - grouping identifier only"
  label: "Ground truth target - target label (0 or 1)"
  attack_category: "Evaluation slice label - benign, light, heavy"
  subdomain: "Raw subdomain text string (replaced by sl_subdomain_flag)"
  distinct_ip: "Constant IP address identity shortcut in stateful table"
  reverse_dns: "Raw string reverse DNS identity shortcut in stateful table"
  distinct_domains: "Raw domain identity string list (replaced by sf_n_distinct_domains count)"
  unique_asn: "Raw ASN identity string list (replaced by sf_n_asns count)"
  unique_country: "Raw country string list (replaced by sf_n_countries count)"
  unique_ttl: "Raw TTL string list (replaced by sf_ttl_count)"
  rr_type: "Raw record type categorical (replaced by one-hot features)"
  NS_frequency: "Constant column with nunique=1 across all rows"
  CNAME_frequency: "Constant column with nunique=1 across all rows"
  SOA_frequency: "Constant column with nunique=1 across all rows"
  NULL_frequency: "Constant column with nunique=1 across all rows"
  HINFO_frequency: "Constant column with nunique=1 across all rows"
  MX_frequency: "Constant column with nunique=1 across all rows"
  SRV_frequency: "Constant column with nunique=1 across all rows"
  OPT_frequency: "Constant column with nunique=1 across all rows"
  a_records: "Constant column with nunique=1 across all rows"
